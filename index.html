<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Inventario Dotazioni F&B — Rosa Grand</title>
<style>
  :root{
    --bg:#F5F3EF; --surface:#FFFFFF; --ink:#1C2A25; --muted:#6C7A73;
    --primary:#14493B; --primary-tint:#E6EEEA; --accent:#B0863F;
    --danger:#B0463B; --danger-tint:#F6E9E7; --ok:#2E7D5B;
    --border:#E4DED4; --border-strong:#D2CABB; --shadow:0 1px 2px rgba(28,42,37,.06),0 4px 14px rgba(28,42,37,.05);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.2px}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit;font-size:16px}

  /* ---- Top bar ---- */
  header{position:sticky;top:0;z-index:30;background:var(--primary);color:#fff;
    padding:10px 14px 12px;box-shadow:0 2px 10px rgba(20,73,59,.25)}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand h1{font-size:19px;color:#fff;line-height:1.15}
  .brand .sub{font-size:11.5px;color:#CBE0D7;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
  .rule{height:2px;width:34px;background:var(--accent);border-radius:2px;margin-top:6px}
  .topbtns{display:flex;gap:8px;flex-shrink:0}
  .topbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);
    padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .topbtn:active{background:rgba(255,255,255,.22)}
  .topbtn.gold{background:var(--accent);border-color:var(--accent)}

  /* ---- Search & filters ---- */
  .controls{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:12px 14px 8px;border-bottom:1px solid var(--border)}
  .searchwrap{position:relative;margin-bottom:9px}
  .searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
  #q{width:100%;padding:14px 44px 14px 42px;border:1.5px solid var(--border-strong);
    border-radius:12px;background:var(--surface);outline:none}
  #q:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint)}
  .clearq{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:20px;display:none;align-items:center;justify-content:center}
  .clearq.show{display:flex}
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .filters select{flex:0 0 auto;padding:9px 30px 9px 12px;border:1px solid var(--border-strong);
    border-radius:10px;background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' fill='none' stroke='%236C7A73' stroke-width='1.6'/></svg>") no-repeat right 11px center;
    -webkit-appearance:none;appearance:none;color:var(--ink);max-width:46vw}
  .togglebtn{flex:0 0 auto;padding:9px 13px;border:1px solid var(--border-strong);border-radius:10px;
    background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
  .togglebtn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .importbtn{flex:0 0 auto;padding:9px 13px;border:1px solid var(--accent);border-radius:10px;
    background:#FBF6EC;color:var(--accent);font-size:14px;font-weight:700;white-space:nowrap;position:relative;overflow:hidden}
  .importbtn input{position:absolute;inset:0;opacity:0;width:100%}
  /* progress overlay */
  .prog-bg{position:fixed;inset:0;background:rgba(20,30,26,.62);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
  .prog-bg.show{display:flex}
  .prog{background:var(--surface);border-radius:18px;padding:24px 22px;width:100%;max-width:400px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .prog h2{font-size:18px;margin-bottom:6px}
  .prog .psub{font-size:13px;color:var(--muted);margin-bottom:16px}
  .bar{height:10px;background:var(--bg);border-radius:20px;overflow:hidden;border:1px solid var(--border)}
  .bar span{display:block;height:100%;width:0%;background:var(--primary);transition:width .12s linear}
  .pnum{font-size:13px;color:var(--muted);margin-top:9px;font-variant-numeric:tabular-nums}
  .presult{text-align:left;font-size:14px;line-height:1.6;margin-top:4px}
  .presult b{color:var(--primary)}
  .prog .btn-primary{margin-top:16px;width:100%}
  .meta{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 2px;font-size:12.5px;color:var(--muted)}
  .meta b{color:var(--primary);font-weight:700}

  /* ---- List ---- */
  main{padding:8px 12px 120px;max-width:820px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 13px 11px;margin-bottom:11px;box-shadow:var(--shadow)}
  .card.counted{border-color:#BFD8CC}
  .card-top{display:flex;gap:11px}
  .thumb{flex:0 0 60px;width:60px;height:60px;border-radius:10px;border:1.5px dashed var(--border-strong);
    background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--muted);font-size:10px;gap:2px;overflow:hidden;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb.has{border-style:solid;border-color:var(--ok)}
  .thumb .cam{font-size:19px;line-height:1}
  .thumb input{position:absolute;inset:0;opacity:0}
  .arch{position:absolute;bottom:0;left:0;right:0;background:rgba(20,73,59,.85);color:#fff;
    font-size:8.5px;font-weight:700;letter-spacing:.4px;text-align:center;padding:1px 0}
  .info{flex:1;min-width:0}
  .descrow{display:flex;align-items:flex-start;gap:4px}
  .desc{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25;color:var(--ink);
    border:1px solid transparent;border-radius:8px;padding:3px 6px;margin:-3px -6px;
    background:transparent;font-family:inherit;outline:none}
  .desc:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-tint);margin:0;padding:6px}
  .desc.renamed{color:var(--accent)}
  .editico{flex:0 0 auto;color:var(--border-strong);font-size:13px;padding:2px 4px;line-height:1}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
  .tag.tip{background:#F3EEE4;color:var(--accent);border-color:transparent}
  .tag.new{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}
  .tag.zone{background:#EFEAE0;color:var(--muted);border-color:transparent}
  .noterow{display:flex;align-items:center;gap:8px;margin-top:10px}
  .noterow .noteico{flex:0 0 auto;color:var(--muted);font-size:14px}
  .noteinput{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--border);border-radius:10px;
    background:var(--bg);outline:none;font-size:14px;color:var(--ink)}
  .noteinput.filled{background:#FBF6EC;border-color:var(--accent);color:#8a5a1e;font-weight:500}
  .noteinput:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-tint)}
  .noteinput::placeholder{color:var(--border-strong)}
  .ref{font-size:11.5px;color:var(--muted);margin-top:7px}
  .ref b{color:var(--ink);font-weight:600}

  /* counter row */
  .counter{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}
  .counter .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;flex:0 0 auto}
  .stepbtn{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1.5px solid var(--border-strong);
    background:var(--surface);font-size:22px;font-weight:600;color:var(--primary);display:flex;align-items:center;justify-content:center}
  .stepbtn:active{background:var(--primary-tint)}
  .qty{flex:1 1 auto;min-width:0;text-align:center;font-size:26px;font-weight:700;color:var(--ink);
    padding:6px 2px;border:none;border-bottom:2px solid var(--primary);background:transparent;width:100%;outline:none}
  .qty.empty{color:var(--border-strong);border-bottom-color:var(--border-strong)}
  .addrow{display:flex;align-items:center;gap:7px;margin-top:9px}
  .addrow input{flex:1;padding:11px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--bg);text-align:center;font-weight:600}
  .addbtn{flex:0 0 auto;padding:0 16px;height:42px;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
  .addbtn:active{background:#0f3a30}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty-state .big{font-size:40px;margin-bottom:8px}

  /* ---- Modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,26,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;
    padding:18px 18px 26px;max-height:92vh;overflow-y:auto;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
  .modal h2{font-size:20px;margin-bottom:4px}
  .modal .msub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:5px}
  .field label .req{color:var(--danger)}
  .field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid var(--border-strong);
    border-radius:11px;background:var(--bg);outline:none;-webkit-appearance:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:#fff}
  .field.two{display:flex;gap:10px}.field.two>div{flex:1}
  .modal-actions{display:flex;gap:10px;margin-top:8px}
  .btn-primary{flex:1;padding:15px;background:var(--primary);color:#fff;border-radius:12px;font-weight:700;font-size:15px}
  .btn-ghost{flex:0 0 auto;padding:15px 20px;background:var(--bg);color:var(--muted);border-radius:12px;font-weight:600;border:1px solid var(--border)}
  .photo-preview{width:100%;height:150px;border-radius:11px;object-fit:cover;margin-top:6px;display:none;border:1px solid var(--border)}

  .menuitem{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--border);
    border-radius:12px;background:var(--bg);margin-bottom:10px}
  .menuitem b{display:block;font-size:15px;margin-bottom:3px}
  .menuitem span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
  .menuitem.danger{background:var(--danger-tint);border-color:#E9CFCB}
  .menuitem.danger b{color:var(--danger)}
  .delbtn{margin-left:auto;font-size:11.5px;color:var(--danger);background:var(--danger-tint);
    border:1px solid #E9CFCB;padding:4px 10px;border-radius:20px;font-weight:600}
  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;
    z-index:60;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <h1>Inventario Dotazioni F&amp;B</h1>
      <div class="sub">Starhotels Rosa Grand — Milano</div>
      <div class="rule"></div>
    </div>
    <div class="topbtns">
      <button class="topbtn" id="btnNew">＋ Nuovo</button>
      <button class="topbtn gold" id="btnExport">⬇ Excel</button>
      <button class="topbtn" id="btnMenu" aria-label="Altro">⋯</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="searchwrap">
    <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="8" cy="8" r="6" fill="none" stroke="#1C2A25" stroke-width="1.7"/><path d="M12.5 12.5L16 16" stroke="#1C2A25" stroke-width="1.7" stroke-linecap="round"/></svg>
    <input id="q" type="search" inputmode="search" placeholder="Cerca articolo, luogo, tipologia…" autocomplete="off">
    <button class="clearq" id="clearq" aria-label="Cancella">×</button>
  </div>
  <div class="filters">
    <select id="fTip"><option value="">Tutte le tipologie</option></select>
    <label class="importbtn">🖼 Importa foto
      <input type="file" accept="image/*" multiple id="bulkPhotos">
    </label>
  </div>
  <div class="meta">
    <span id="count">—</span>
    <span><b id="done">0</b> conteggiati</span>
  </div>
</div>

<main id="list"></main>

<!-- Modal nuovo articolo -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>Nuovo articolo</h2>
    <div class="msub">Aggiungi qualcosa che non è già in lista.</div>
    <div class="field">
      <label>Descrizione <span class="req">*</span></label>
      <input id="mDesc" placeholder="Es. BICCHIERE FLUTE CRISTALLO">
    </div>
    <div class="field two">
      <div><label>Tipologia</label><select id="mTip"></select></div>
      <div><label>Quantità</label><input id="mQty" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="field">
      <label>Note</label>
      <input id="mNote" placeholder="Facoltativo">
    </div>
    <div class="field">
      <label>Foto</label>
      <input id="mPhoto" type="file" accept="image/*" capture="environment">
      <img id="mPhotoPrev" class="photo-preview" alt="">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="mCancel">Annulla</button>
      <button class="btn-primary" id="mSave">Aggiungi articolo</button>
    </div>
  </div>
</div>

<div class="prog-bg" id="progBg">
  <div class="prog">
    <h2 id="progTitle">Importo le foto</h2>
    <div class="psub" id="progSub">Non chiudere la pagina.</div>
    <div class="bar"><span id="progBar"></span></div>
    <div class="pnum" id="progNum">0 di 0</div>
    <div class="presult" id="progResult"></div>
    <button class="btn-primary" id="progClose" style="display:none">Fatto</button>
  </div>
</div>

<div class="modal-bg" id="menuBg">
  <div class="modal">
    <h2>Strumenti</h2>
    <div class="msub">Backup, ripristino e azzeramento.</div>
    <button class="menuitem" id="btnBackup"><b>💾 Salva backup</b><span>Scarica un file con conteggi, note, articoli nuovi e foto. Tienilo da parte: se cambi tablet o si cancellano i dati, recuperi tutto.</span></button>
    <button class="menuitem" id="btnRestore"><b>♻️ Ripristina backup</b><span>Ricarica un file di backup salvato in precedenza.</span></button>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
    <button class="menuitem" id="btnZip"><b>📷 Scarica le foto (ZIP)</b><span>Un pacchetto con tutte le foto scattate, rinominate con l'articolo, più un elenco riepilogativo. Da consegnare insieme all'Excel.</span></button>
    <button class="menuitem danger" id="btnReset"><b>🗑 Azzera conteggio</b><span>Cancella tutte le quantità, le note e le foto di questo inventario. Gli articoli restano.</span></button>
    <div class="modal-actions"><button class="btn-primary" id="menuClose">Chiudi</button></div>
  </div>
</div>

<div id="toast"></div>

<script>

    let done=false; const fine=()=>{ if(!done){done=true;res();} };
    try{
      const r=indexedDB.open("inventario_rosagrand");
      r.onupgradeneeded=e=>creaStore(e.target.result);
      r.onsuccess=e=>{
        const d=e.target.result;
        const mancanti=STORES.filter(s=>!d.objectStoreNames.contains(s));
        if(!mancanti.length){ db=d; sorvegliaDb(); motivoArchivio=""; return fine(); }
        const v=d.version+1; d.close();
        const r2=indexedDB.open("inventario_rosagrand",v);
        r2.onupgradeneeded=ev=>creaStore(ev.target.result);
        r2.onsuccess=ev=>{ db=ev.target.result; sorvegliaDb(); motivoArchivio=""; fine(); };
        r2.onerror=()=>{ db=null; motivoArchivio="assente"; fine(); };
        r2.onblocked=()=>{ db=null; motivoArchivio="bloccato"; fine(); };
      };
      r.onerror=()=>{ db=null; motivoArchivio="assente"; fine(); };
      r.onblocked=()=>{ db=null; motivoArchivio="bloccato"; fine(); };
      setTimeout(()=>{ if(!done){ db=null; motivoArchivio=motivoArchivio||"bloccato"; fine(); } },3000);
    }catch(e){ db=null; motivoArchivio="assente"; fine(); }
  }).then(async ()=>{
    // se bloccato da un'altra scheda, riprova un paio di volte
    if(!db && motivoArchivio==="bloccato" && tentativo<1){
      await new Promise(r=>setTimeout(r,900));
      return openDB(tentativo+1);
    }
  });
}
/* se un'altra scheda aggiorna l'archivio, libera la connessione invece di bloccarla */
function sorvegliaDb(){
  if(!db) return;
  db.onversionchange=()=>{ try{db.close();}catch(e){} db=null; mostraAvvisoArchivio("ricarica"); };
}
function mostraAvvisoArchivio(motivo){
  let w=document.getElementById("dbWarn");
  if(!w){
    w=document.createElement("div"); w.id="dbWarn";
    w.style.cssText="background:#F6E9E7;color:#B0463B;padding:10px 14px;font-size:13px;font-weight:600;text-align:center;line-height:1.35";
    document.querySelector("main").before(w);
  }
  w.textContent = motivo==="bloccato"
    ? "⚠ Salvataggio bloccato: l'inventario è aperto in un'altra scheda. Chiudi le altre schede e ricarica la pagina."
    : motivo==="ricarica"
    ? "⚠ L'archivio è stato aggiornato in un'altra scheda. Ricarica la pagina per continuare a salvare."
    : "⚠ Salvataggio non disponibile su questo browser (navigazione anonima o dati dei siti bloccati): i conteggi non verranno memorizzati.";
}
function idbGetAll(store){
  return new Promise(res=>{
    const out={};
    if(!db || !db.objectStoreNames.contains(store)) return res(out);
    try{
      const cur=db.transaction(store,"readonly").objectStore(store).openCursor();
      cur.onsuccess=e=>{const c=e.target.result; if(c){out[c.key]=c.value;c.continue();} else res(out);};
      cur.onerror=()=>res(out);
    }catch(e){ res(out); }
  });
}
function idbPut(store,key,val){
  if(!db) return;
  try{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val,key);}catch(e){}
}
function idbDel(store,key){
  if(!db) return;
  try{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);}catch(e){}
}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1900);}
function esc(s){return (s??"").toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return (s??"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}

const listEl=document.getElementById("list");

/* nome dell'articolo: quello rinominato dall'utente, altrimenti l'originale */
function nomeArt(it){ const r=records[it.id]; return (r && r.desc) ? r.desc : it.descrizione; }
function normRef(r){ const s=String(r??"").trim(); if(!s) return ""; const n=parseInt(s,10); return isNaN(n)?s:String(n); }
function getPhoto(it){
  if(photos[it.id]) return {src:photos[it.id],arch:false};
  const k=normRef(it.fotoRef);
  if(k && refPhotos[k]) return {src:refPhotos[k],arch:true};
  return null;
}
function countedNum(id){const r=records[id]; return (r && r.q2026!=="" && r.q2026!=null)? Number(r.q2026):null;}

function buildCard(it){
  const rec=records[it.id]||{};
  const q=(rec.q2026!=null && rec.q2026!=="")?rec.q2026:"";
  const isCounted=q!=="";
  const isNew=it.id>=NEW_ID_BASE;
  const note=rec.note!=null?rec.note:(it.note||"");
  const nome=nomeArt(it);
  const rinominato=!!(rec.desc && rec.desc!==it.descrizione);
  const tags=[];
  if(it.luogo) tags.push(`<span class="tag luogo">📍 ${esc(it.luogo)}</span>`);
  if(it.specifico) tags.push(`<span class="tag zone">${esc(it.specifico)}</span>`);
  if(it.tipologia) tags.push(`<span class="tag tip">${esc(it.tipologia)}</span>`);
  if(isNew) tags.push(`<span class="tag new">NUOVO</span>`);

  const ph=getPhoto(it);
  const thumb = ph
    ? `<div class="thumb has" data-act="photo" data-id="${it.id}"><img src="${ph.src}" alt="">${ph.arch?'<span class="arch">2024</span>':''}<input type="file" accept="image/*" capture="environment" data-file="${it.id}"></div>`
    : `<div class="thumb" data-act="photo" data-id="${it.id}"><span class="cam">📷</span><span>Foto</span><input type="file" accept="image/*" capture="environment" data-file="${it.id}"></div>`;

  const refParts=[];
  if(it.q2024!=="" && it.q2024!=null) refParts.push(`Conteggio 2024: <b>${esc(it.q2024)}</b>`);

  return `<div class="card ${isCounted?'counted':''}" data-card="${it.id}">
    <div class="card-top">
      ${thumb}
      <div class="info">
        <div class="descrow">
          <input class="desc ${rinominato?'renamed':''}" data-desc="${it.id}" value="${esc(nome)}" placeholder="Nome articolo">
          <button class="editico" data-act="rename" data-id="${it.id}" title="Rinomina">✎</button>
        </div>
        <div class="tags">${tags.join("")}${isNew?`<button class="delbtn" data-act="del" data-id="${it.id}">Elimina</button>`:""}</div>
        ${refParts.length?`<div class="ref">${refParts.join(" · ")}</div>`:""}
      </div>
    </div>
    <div class="counter">
      <span class="lbl">2026</span>
      <button class="stepbtn" data-act="minus" data-id="${it.id}">−</button>
      <input class="qty ${isCounted?'':'empty'}" inputmode="numeric" data-qty="${it.id}" value="${esc(q)}" placeholder="0">
      <button class="stepbtn" data-act="plus" data-id="${it.id}">＋</button>
    </div>
    <div class="addrow">
      <input inputmode="numeric" placeholder="aggiungi quantità (es. 30)" data-add="${it.id}">
      <button class="addbtn" data-act="add" data-id="${it.id}">＋ Aggiungi</button>
    </div>
    <div class="noterow">
      <span class="noteico">✎</span>
      <input class="noteinput ${note?'filled':''}" data-note="${it.id}" placeholder="Aggiungi una nota…" value="${esc(note)}">
    </div>
  </div>`;
}

function render(){
  const term=norm(qEl.value.trim());
  const words=term.split(/\s+/).filter(Boolean);
  const tip=fTip.value;
  let arr=allItems.filter(it=>{
    if(tip && it.tipologia!==tip) return false;
    if(words.length){
      const hay=norm(nomeArt(it)+" "+it.descrizione+" "+it.luogo+" "+it.specifico+" "+it.tipologia);
      if(!words.every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  document.getElementById("count").textContent = arr.length + " di " + allItems.length + " articoli";
  if(!arr.length){
    listEl.innerHTML=`<div class="empty-state"><div class="big">🔍</div>Nessun articolo trovato.<br>Prova con altre lettere o aggiungi un nuovo articolo.</div>`;
    return;
  }
  // performance: cap render, show note if huge (raro con la ricerca)
  const CAP=2000;
  let html=arr.slice(0,CAP).map(buildCard).join("");
  if(arr.length>CAP) html+=`<div class="empty-state">…e altri ${arr.length-CAP}. Affina la ricerca per vederli.</div>`;
  listEl.innerHTML=html;
}

function updateDone(){
  const n=allItems.filter(it=>countedNum(it.id)!=null).length;
  document.getElementById("done").textContent=n;
}

function setQty(id,val){
  val=(val===""||val==null)?"":Math.max(0,Math.round(Number(val))||0);
  const rec=records[id]||{}; rec.q2026=val; records[id]=rec;
  idbPut("records",Number(id),rec);
  updateDone();
  // aggiorna la classe card senza re-render completo
  const card=document.querySelector(`[data-card="${id}"]`);
  if(card){ card.classList.toggle("counted", val!==""); }
}

listEl.addEventListener("click",e=>{
  const btn=e.target.closest("[data-act]"); if(!btn) return;
  const act=btn.dataset.act, id=Number(btn.dataset.id);
  if(act==="photo"){ return; } // gestito dall'input file dentro
  if(act==="rename"){
    const inp=document.querySelector(`[data-desc="${id}"]`);
    if(inp){ inp.focus(); try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){} }
    return;
  }
  if(act==="del"){
    const it=allItems.find(x=>x.id===id);
    if(!it) return;
    if(!window.confirm("Eliminare definitivamente «"+nomeArt(it)+"»?")) return;
    customItems=customItems.filter(x=>x.id!==id);
    delete records[id]; delete photos[id];
    idbDel("custom",id); idbDel("records",id); idbDel("photos",id);
    rebuildAll(); updateDone(); render();
    toast("Articolo eliminato");
    return;
  }
  const qInput=document.querySelector(`[data-qty="${id}"]`);
  let cur=Number(qInput.value)||0;
  if(act==="plus")  cur+=1;
  if(act==="minus") cur=Math.max(0,cur-1);
  if(act==="add"){
    const addInput=document.querySelector(`[data-add="${id}"]`);
    const add=Math.round(Number(addInput.value)||0);
    if(!add){toast("Scrivi un numero da aggiungere");return;}
    cur+=add; addInput.value="";
    toast("Aggiunti "+add+" → totale "+cur);
  }
  qInput.value=cur; qInput.classList.remove("empty");
  setQty(id,cur);
});

listEl.addEventListener("keydown",e=>{

});
listEl.addEventListener("change",e=>{
  if(e.target.matches("[data-qty]")){
    const id=Number(e.target.dataset.qty);
    setQty(id,e.target.value);
    e.target.classList.toggle("empty", e.target.value==="");
  }
  if(e.target.matches("[data-desc]")){
    const id=Number(e.target.dataset.desc);
    const it=allItems.find(x=>x.id===id);
    const nuovo=e.target.value.trim();

    if(!nuovo){ e.target.value=nomeArt(it); toast("Il nome non può essere vuoto"); return; }
    const rec=records[id]||{};
    if(nuovo===it.descrizione) delete rec.desc; else rec.desc=nuovo;
    records[id]=rec; idbPut("records",id,rec);
    e.target.classList.toggle("renamed", !!rec.desc);
    if(it.id>=NEW_ID_BASE){ it.descrizione=nuovo; idbPut("custom",id,it); delete rec.desc; records[id]=rec; idbPut("records",id,rec); e.target.classList.remove("renamed"); }
    rebuildAll();
    toast("Nome aggiornato");

  }
  if(e.target.matches("[data-note]")){
    const id=Number(e.target.dataset.note);

    idbPut("records",id,rec);

      wrap.classList.add("has");
      wrap.querySelector(".cam")?.remove();

      img.src=dataUrl;
      wrap.querySelectorAll("span").forEach(s=>s.remove());
      toast("Foto salvata");
    });
  }
});

/* comprimi la foto per non riempire la memoria */
function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=1100; let{width:w,height:h}=img;
      if(w>h && w>max){h=h*max/w;w=max;} else if(h>=w && h>max){w=w*max/h;h=max;}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",0.72));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ===== Generatore XLSX reale: ZIP (stored) + OOXML, senza librerie ===== */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function strBytes(s) {
  // UTF-8 encode
  if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(s);
  const out = [];
  for (let i = 0; i < s.length; i++) {
    let c = s.codePointAt(i);
    if (c > 0xFFFF) i++;
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0x10000) out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else out.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return new Uint8Array(out);
}

/* ZIP senza compressione (metodo "stored") — valido e sufficiente per XLSX */
function makeZip(files) {
  const chunks = [], central = [];
  let offset = 0;

  const u16 = v => [v & 0xFF, (v >> 8) & 0xFF];
  const u32 = v => [v & 0xFF, (v >> 8) & 0xFF, (v >> 16) & 0xFF, (v >>> 24) & 0xFF];

  for (const f of files) {
    const nameB = strBytes(f.name);
    const dataB = f.data;
    const crc = crc32(dataB);

    const local = [].concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(dataB.length), u32(dataB.length),
      u16(nameB.length), u16(0)
    );
    chunks.push(new Uint8Array(local), nameB, dataB);

    central.push([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(dataB.length), u32(dataB.length),
      u16(nameB.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    ), nameB);

    offset += local.length + nameB.length + dataB.length;
  }

  const cenParts = [];
  let cenLen = 0;
  for (const c of central) {
    const arr = (c instanceof Uint8Array) ? c : new Uint8Array(c);
    cenParts.push(arr); cenLen += arr.length;
  }
  const eocd = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0),
    u16(files.length), u16(files.length),
    u32(cenLen), u32(offset), u16(0)
  ));

  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total + cenLen + eocd.length);
  let p = 0;
  for (const c of chunks) { out.set(c, p); p += c.length; }
  for (const c of cenParts) { out.set(c, p); p += c.length; }
  out.set(eocd, p);
  return out;
}

function xmlEsc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;")
    // rimuove caratteri di controllo non ammessi in XML
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
}

function colLetter(n) { // 1 -> A
  let s = "";
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

/**
 * rows: array di array. Valori numerici -> celle numeriche, altrimenti testo.
 * headers: array di stringhe (prima riga, in grassetto).
 */
function buildXlsx(headers, rows, sheetName, images) {
  // images: [{rowIndex (0-based sui dati), col (0-based), bytes: Uint8Array}]
  images = images || [];
  const widths = [16, 16, 14, 62, 12, 12, 14, 15, 30];
  const IMG_PX = 78;                       // lato immagine in pixel
  const EMU = 9525;                        // EMU per pixel
  const rowsWithImg = new Set(images.map(im => im.rowIndex));

  /* --- tabella condivisa delle stringhe (compatibile con tutti i lettori) --- */
  const sstIndex = new Map();
  const sstList = [];
  function sst(s) {
    const k = String(s);
    let i = sstIndex.get(k);
    if (i === undefined) { i = sstList.length; sstIndex.set(k, i); sstList.push(k); }
    return i;
  }

  let sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>`;
  widths.forEach((w, i) => { sheet += `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`; });
  sheet += `</cols><sheetData>`;

  sheet += `<row r="1" ht="30" customHeight="1">`;
  headers.forEach((h, i) => {
    sheet += `<c r="${colLetter(i + 1)}1" s="1" t="s"><v>${sst(h)}</v></c>`;
  });
  sheet += `</row>`;

  rows.forEach((row, ri) => {
    const r = ri + 2;
    sheet += rowsWithImg.has(ri) ? `<row r="${r}" ht="62" customHeight="1">` : `<row r="${r}">`;
    row.forEach((val, ci) => {
      if (val === "" || val === null || val === undefined) return;
      const ref = colLetter(ci + 1) + r;
      const isNum = (typeof val === "number") ||
        (typeof val === "string" && val.trim() !== "" && /^-?\d+([.,]\d+)?$/.test(val.trim()));
      if (isNum) {
        const num = (typeof val === "number") ? val : Number(String(val).trim().replace(",", "."));
        if (isFinite(num)) { sheet += `<c r="${ref}" s="3"><v>${num}</v></c>`; return; }
      }
      sheet += `<c r="${ref}" s="2" t="s"><v>${sst(val)}</v></c>`;
    });
    sheet += `</row>`;
  });
  sheet += `</sheetData><autoFilter ref="A1:${colLetter(headers.length)}${rows.length + 1}"/>`;
  if (images.length) sheet += `<drawing r:id="rIdDr"/>`;
  sheet += `</worksheet>`;

  const sharedStrings = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${sstList.length}" uniqueCount="${sstList.length}">` +
    sstList.map(s => `<si><t xml:space="preserve">${xmlEsc(s)}</t></si>`).join("") + `</sst>`;

  /* ---- parti per le immagini incorporate ---- */
  const extraFiles = [];
  let ctExtra = "", sheetRels = "";
  if (images.length) {
    let drawing = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">`;

      const cx = IMG_PX * EMU, cy = IMG_PX * EMU;
      drawing += `<xdr:oneCellAnchor><xdr:from><xdr:col>${im.col}</xdr:col><xdr:colOff>${Math.round(0.6 * EMU) * 10}</xdr:colOff><xdr:row>${im.rowIndex + 1}</xdr:row><xdr:rowOff>${2 * EMU}</xdr:rowOff></xdr:from><xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${n}" name="Foto ${n}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rIdImg${n}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`;
    });
    drawing += `</xdr:wsDr>`;
    drawRels += `</Relationships>`;
    extraFiles.push({ name: "xl/drawings/drawing1.xml", data: strBytes(drawing) });
    extraFiles.push({ name: "xl/drawings/_rels/drawing1.xml.rels", data: strBytes(drawRels) });
    sheetRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdDr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>`;
    extraFiles.push({ name: "xl/worksheets/_rels/sheet1.xml.rels", data: strBytes(sheetRels) });
    ctExtra = `<Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`;
  }

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${ctExtra}<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/></Types>`;

  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;

  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(sheetName).slice(0, 31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`;

  const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>`;

  /* stili: 0=base, 1=intestazione, 2=testo, 3=numero intero */
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0"/></numFmts><fonts count="2"><font><sz val="11"/><color theme="1"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF14493B"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

  return makeZip([
    { name: "[Content_Types].xml", data: strBytes(contentTypes) },
    { name: "_rels/.rels", data: strBytes(rels) },
    { name: "xl/workbook.xml", data: strBytes(workbook) },
    { name: "xl/_rels/workbook.xml.rels", data: strBytes(wbRels) },
    { name: "xl/styles.xml", data: strBytes(styles) },
    { name: "xl/sharedStrings.xml", data: strBytes(sharedStrings) },
    { name: "xl/worksheets/sheet1.xml", data: strBytes(sheet) },
  ].concat(extraFiles));
}

/* base64 dataURL -> byte */
function dataUrlToBytes(u){
  const b64=String(u).split(",")[1]||"";
  const bin=atob(b64);
  const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
/* miniatura quadrata per l'Excel (ritaglio centrale, ~240px) */
function makeThumb(dataUrl,size){
  return new Promise(res=>{
    try{
      const img=new Image();
      img.onload=()=>{
        try{
          const s=Math.min(img.width,img.height);
          const sx=(img.width-s)/2, sy=(img.height-s)/2;
          const cv=document.createElement("canvas"); cv.width=size; cv.height=size;
          cv.getContext("2d").drawImage(img,sx,sy,s,s,0,0,size,size);
          res(cv.toDataURL("image/jpeg",0.72));
        }catch(e){ res(dataUrl); }
      };
      img.onerror=()=>res(dataUrl);
      img.src=dataUrl;
    }catch(e){ res(dataUrl); }
  });
}

async function exportExcel(){
  const btn=document.getElementById("btnExport");
  const label=btn.textContent;
  try{
    btn.textContent="…";
    const d=new Date();
    const dd=String(d.getDate()).padStart(2,"0"), mm=String(d.getMonth()+1).padStart(2,"0"), yy=d.getFullYear();
    const dateLabel=`${dd}/${mm}/${yy}`;
    const headers=["Luogo","Specifico","Tipologia","Descrizione",
      "Quantità rilevata al 01/08/2023","Quantità rilevata al 28/03/2024",
      "Quantità rilevata al "+dateLabel,"Foto Articolo","Note"];

    const conFoto=allItems.filter(it=>getPhoto(it)).length;
    if(conFoto>0) toast("Preparo "+conFoto+" foto…");

    const rows=[], images=[];
    for(let i=0;i<allItems.length;i++){
      const it=allItems[i];
      const rec=records[it.id]||{};
      const q26=(rec.q2026!=null && rec.q2026!=="")?rec.q2026:"";
      const note=rec.note!=null?rec.note:(it.note||"");
  const nome=nomeArt(it);
  const rinominato=!!(rec.desc && rec.desc!==it.descrizione);
      const isNew=it.id>=NEW_ID_BASE;
      const ph=getPhoto(it);
      const hasPhoto=!!ph;
      // se c'è la foto la cella resta libera per l'immagine; altrimenti resta il vecchio riferimento
      const foto=hasPhoto?"":(it.fotoRef||"");
      rows.push([it.luogo,it.specifico,it.tipologia,nomeArt(it)+(isNew?"  [NUOVO]":""),
        it.q2023,it.q2024,q26,foto,note]);
      if(hasPhoto){
        const thumb=await makeThumb(ph.src,240);
        try{ images.push({rowIndex:i, col:7, bytes:dataUrlToBytes(thumb)}); }catch(e){}
      }
    }

    const bytes=buildXlsx(headers,rows,"Inventario "+yy,images);
    const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`Inventario_Rosa_Grand_${yy}-${mm}-${dd}.xlsx`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{a.remove(); URL.revokeObjectURL(url);},1500);

  }catch(err){

  }finally{ btn.textContent=label; }
}


/* ============ Importazione foto d'archivio ============ */
/* Abbina il nome del file al numero di riferimento: "878.jpg", "IMG_878.jpeg", "878 (1).png" -> 878 */
function refFromFilename(name){
  const base=String(name).replace(/\.[^.]+$/,"");
  const m=base.match(/\d+/g);
  if(!m) return "";
  return String(parseInt(m[m.length-1],10));
}
const REF_ATTESI=(()=>{ const s=new Set(); ITEMS.forEach(it=>{const k=normRef(it.fotoRef); if(k)s.add(k);}); return s; })();

document.getElementById("bulkPhotos").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value="";
  if(!files.length) return;
  let usate=0, scartate=0, errori=0;
  toast("Importo "+files.length+" foto…");
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const ref=refFromFilename(f.name);
    if(!ref || !REF_ATTESI.has(ref)){ scartate++; continue; }
    try{
      const dataUrl=await new Promise((res,rej)=>{
        const fr=new FileReader();
        fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error("lettura"));
        fr.readAsDataURL(f);
      });
      const small=await makeThumb(dataUrl,420);
      refPhotos[ref]=small;
      idbPut("refphotos",ref,small);
      usate++;
    }catch(err){ errori++; }
    if(i%25===0){ toast("Importate "+usate+" di "+files.length+"…"); await new Promise(r=>setTimeout(r,0)); }
  }
  render();
  toast("Importate "+usate+" foto"+(scartate?" · "+scartate+" senza corrispondenza":"" ));
});

/* ============ Strumenti: backup, ripristino, azzeramento ============ */
const menuBg=document.getElementById("menuBg");
document.getElementById("btnMenu").addEventListener("click",()=>menuBg.classList.add("show"));
document.getElementById("menuClose").addEventListener("click",()=>menuBg.classList.remove("show"));

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);
}

document.getElementById("btnBackup").addEventListener("click",()=>{
  try{
    const d=new Date();
    const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const payload={formato:"inventario-rosagrand", versione:2, data:d.toISOString(), records, photos, refPhotos, customItems};
    downloadBlob(new Blob([JSON.stringify(payload)],{type:"application/json"}), `Backup_Inventario_${stamp}.json`);
    menuBg.classList.remove("show");

  }catch(err){ toast("Errore backup: "+err.message); }
});

document.getElementById("btnRestore").addEventListener("click",()=>document.getElementById("restoreFile").click());
document.getElementById("restoreFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const p=JSON.parse(fr.result);
      if(p.formato!=="inventario-rosagrand") throw new Error("file non riconosciuto");
      if(!window.confirm("Ripristinare il backup? I dati attuali su questo dispositivo verranno sostituiti.")) return;
      records=p.records||{}; photos=p.photos||{}; refPhotos=p.refPhotos||{}; customItems=p.customItems||[];
      Object.keys(records).forEach(k=>idbPut("records",Number(k),records[k]));
      Object.keys(photos).forEach(k=>idbPut("photos",Number(k),photos[k]));
      Object.keys(refPhotos).forEach(k=>idbPut("refphotos",k,refPhotos[k]));
      customItems.forEach(it=>idbPut("custom",it.id,it));
      rebuildAll(); updateDone(); render();
      menuBg.classList.remove("show");
      toast("Backup ripristinato");
    }catch(err){ toast("Backup non valido: "+err.message); }
  };
  fr.readAsText(f);
  e.target.value="";
});


/* ============ Esportazione foto in ZIP ============ */
function safeName(s){
  return String(s||"articolo")
    .replace(/[\\/:*?"<>|]/g,"-")      // caratteri vietati nei nomi file
    .replace(/\s+/g," ").trim().slice(0,70);
}
function csvCell(v){
  const s=String(v??"");
  return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
async function exportPhotosZip(){
  const btn=document.getElementById("btnZip");
  const lab=btn.innerHTML;
  try{
    const conFoto=allItems.filter(it=>photos[it.id]);
    if(!conFoto.length){ toast("Nessuna foto scattata da esportare"); return; }
    btn.innerHTML="<b>Preparo "+conFoto.length+" foto…</b>";
    await new Promise(r=>setTimeout(r,30));

    const files=[]; const usati=new Set(); const righe=[["File","Descrizione","Luogo","Tipologia","Quantità rilevata","Note"]];
    conFoto.forEach((it,i)=>{
      const rec=records[it.id]||{};
      let base=String(i+1).padStart(3,"0")+" - "+safeName(nomeArt(it));
      let name=base+".jpg", n=2;
      while(usati.has(name)){ name=base+" ("+(n++)+").jpg"; }
      usati.add(name);
      files.push({name, data: dataUrlToBytes(photos[it.id])});
      righe.push([name, nomeArt(it), it.luogo, it.tipologia,
        (rec.q2026!=null&&rec.q2026!=="")?rec.q2026:"", (rec.note!=null?rec.note:(it.note||""))]);
    });

    const csv="\ufeff"+righe.map(r=>r.map(csvCell).join(";")).join("\r\n");
    files.push({name:"_elenco foto.csv", data: strBytes(csv)});

    const d=new Date();
    const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    downloadBlob(new Blob([makeZip(files)],{type:"application/zip"}), `Foto_Inventario_${stamp}.zip`);
    menuBg.classList.remove("show");
    toast(conFoto.length+" foto esportate");
  }catch(err){
    console.error(err);
    toast("Errore export foto: "+err.message);
  }finally{ btn.innerHTML=lab; }
}
document.getElementById("btnZip").addEventListener("click",exportPhotosZip);

document.getElementById("btnReset").addEventListener("click",()=>{
  if(!window.confirm("Azzerare TUTTI i conteggi, le note e le foto?\n\nOperazione non annullabile. Salva prima un backup.")) return;
  if(!window.confirm("Confermi definitivamente l'azzeramento?")) return;
  records={}; photos={};
  try{
    const tx=db.transaction(["records","photos"],"readwrite");
    tx.objectStore("records").clear(); tx.objectStore("photos").clear();
  }catch(e){}
  updateDone(); render();
  menuBg.classList.remove("show");
  toast("Conteggio azzerato");
});

/* ============ Init ============ */
let DUP=new Set(); // descrizioni (normalizzate) che compaiono più volte -> mostra il luogo per distinguerle
/* confronto alfabetico italiano: ignora accenti e maiuscole */
const collator = (typeof Intl!=="undefined" && Intl.Collator)
  ? new Intl.Collator("it",{sensitivity:"base",numeric:true})
  : {compare:(a,b)=>norm(a)<norm(b)?-1:(norm(a)>norm(b)?1:0)};
function rebuildAll(){
  allItems = ITEMS.concat(customItems);
  allItems.sort((a,b)=>collator.compare(nomeArt(a),nomeArt(b)));
  const seen={}; DUP=new Set();
  allItems.forEach(it=>{const k=norm(nomeArt(it)); seen[k]=(seen[k]||0)+1; if(seen[k]>1)DUP.add(k);});
}
function fillSelect(sel,arr,firstStay){
  arr.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o);});
}
async function init(){
  // 1) la lista si vede subito, senza attendere l'archivio
  try{
    rebuildAll();
    fillSelect(fTip,TIPI);
    fillSelect(document.getElementById("mTip"),TIPI);
    updateDone(); render();
  }catch(e){
    console.error(e);
    document.getElementById("list").innerHTML='<div class="empty-state">Errore di avvio: '+esc(e.message)+'</div>';
    return;
  }
  // 2) poi si recuperano i dati salvati e si ridisegna
  try{ await openDB(); }catch(e){ db=null; motivoArchivio="assente"; }
  try{
    records=await idbGetAll("records");
    photos =await idbGetAll("photos");
    refPhotos=await idbGetAll("refphotos");
    const cust=await idbGetAll("custom");
    customItems=Object.values(cust).sort((a,b)=>a.id-b.id);
    rebuildAll(); updateDone(); render();
  }catch(e){ console.error("archivio non leggibile",e); }
  if(!db) mostraAvvisoArchivio(motivoArchivio);
}
init();
